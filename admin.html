<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BROWN Shop — Inventory</title><style>
body{font:15px system-ui,Arial;background:#f7f4ec;color:#29231c;margin:0}main{max-width:1060px;margin:35px auto;padding:20px}h1{margin:0 0 8px}h2{margin-top:32px}p{color:#675f53}input,button{font:inherit;padding:9px;border:1px solid #b8aa96;border-radius:7px}button{background:#32241a;color:white;cursor:pointer}button:hover{background:#60452e}input[type=number]{width:85px}#token{min-width:240px}#message{padding:12px;color:#8b1717}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e6ddd0}td:last-child{white-space:nowrap}.scroller{overflow-x:auto}.order{background:white;padding:12px;margin:10px 0;border-radius:8px}small{color:#675f53}
</style></head><body><main><h1>BROWN Shop — Inventory & Orders</h1><p>Enter the server-side ADMIN_TOKEN to manage stock and see recent orders. Do not share it with customers.</p><input id="token" type="password" placeholder="Admin token" autocomplete="off"><button id="load">Sign in / Refresh</button><button id="logout">Clear token</button><div id="message" role="status"></div><section id="dashboard" hidden><h2>Product stock</h2><div class="scroller"><table><thead><tr><th>Product</th><th>Current stock</th><th>New stock</th><th>Action</th></tr></thead><tbody id="products"></tbody></table></div><h2>Latest 100 orders</h2><div id="orders"></div></section></main><script>
const $=id=>document.getElementById(id);let token='';
const msg=t=>$('message').textContent=t;
async function request(method,body){const r=await fetch('/api/admin',{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
const td=(tr,text)=>{const c=document.createElement('td');c.textContent=String(text);tr.appendChild(c);return c;};
async function load(){token=$('token').value.trim();if(!token)return msg('Admin token required');try{const data=await request('GET');const tbody=$('products');tbody.replaceChildren();for(const p of data.products){const tr=document.createElement('tr');td(tr,p.name);td(tr,p.stock);const input=document.createElement('input');input.type='number';input.min=0;input.max=1000000;input.value=p.stock;const cell=document.createElement('td');cell.appendChild(input);tr.appendChild(cell);const action=document.createElement('td');const b=document.createElement('button');b.textContent='Save';b.onclick=async()=>{const val=Number(input.value);if(!Number.isSafeInteger(val)||val<0)return msg('Enter a valid nonnegative stock');b.disabled=true;try{await request('PATCH',{id_menu:p.id_menu,stock:val});msg('Saved stock for '+p.name);await load();}catch(e){msg(e.message);}finally{b.disabled=false;}};action.appendChild(b);tr.appendChild(action);tbody.appendChild(tr);}
const div=$('orders');div.replaceChildren();for(const o of data.orders){const el=document.createElement('div');el.className='order';const when=new Date(o.created_at).toLocaleString();const lines=o.items.map(x=>`${x.qty} × ${x.name}`).join(', ');el.textContent=`${o.ref} · ${when} · ${o.name} · ${o.phone} · $${(o.total_cents/100).toFixed(2)} · ${o.status} — ${lines}`;div.appendChild(el);}if(!data.orders.length)div.textContent='No orders yet.';$('dashboard').hidden=false;msg('Loaded '+data.products.length+' products and '+data.orders.length+' orders.');}catch(e){$('dashboard').hidden=true;msg(e.message);}}
$('load').onclick=load;$('logout').onclick=()=>{token='';$('token').value='';$('dashboard').hidden=true;msg('Token cleared');};
</script></body></html>
