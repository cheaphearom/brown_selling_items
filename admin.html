<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BROWN Shop — Inventory</title>
<style>
  :root{
    --bg:#f6f1e8;
    --surface:#ffffff;
    --surface-2:#faf6ef;
    --ink:#2a2018;
    --muted:#7a6e5f;
    --line:#ebe2d3;
    --line-strong:#d6c8b3;
    --brand:#3b2718;
    --brand-2:#6b4426;
    --accent:#c98240;
    --accent-soft:#f6e4cf;
    --ok:#2f7d46; --ok-bg:#e3f3e7;
    --warn:#b36b00; --warn-bg:#fdefd0;
    --bad:#b3261e; --bad-bg:#fbe3e0;
    --info:#2f5d9a; --info-bg:#e5edf8;
    --radius:18px;
    --shadow:0 1px 2px rgba(59,39,24,.06),0 10px 30px rgba(59,39,24,.08);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17120e; --surface:#231c16; --surface-2:#2b231c;
      --ink:#f3ece0; --muted:#b3a692; --line:#372d24; --line-strong:#54463a;
      --brand:#e0a86d; --brand-2:#efc08c; --accent:#e0a86d; --accent-soft:#3a2b1c;
      --ok:#8fd3a0; --ok-bg:#1d3324;
      --warn:#f0c46c; --warn-bg:#3a2e14;
      --bad:#f4a69e; --bad-bg:#3b1f1c;
      --info:#a9c4ea; --info-bg:#1e2a3b;
      --shadow:0 1px 0 rgba(255,255,255,.03);
    }
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; color:var(--ink); font:15px/1.55 var(--sans);
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(201,130,64,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(107,68,38,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important}
  .wrap{max-width:1120px; margin:0 auto; padding:0 20px}

  /* ---------- Buttons & inputs ---------- */
  input,button{font:inherit; border-radius:12px; transition:all .15s ease}
  input{
    padding:11px 14px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); min-width:0;
  }
  input::placeholder{color:var(--muted)}
  input:focus-visible,button:focus-visible{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(201,130,64,.25);
  }
  button{
    padding:11px 18px; border:1px solid transparent; cursor:pointer; font-weight:650;
    background:linear-gradient(135deg,var(--brand-2),var(--brand)); color:#fff;
    box-shadow:0 4px 14px rgba(59,39,24,.25);
  }
  @media (prefers-color-scheme:dark){ button{color:#1b1209} }
  button:hover{transform:translateY(-1px); filter:brightness(1.08)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.5; cursor:not-allowed; transform:none; filter:none}
  button.ghost{
    background:var(--surface); color:var(--ink); border-color:var(--line-strong); box-shadow:none;
  }
  button.ghost:hover{background:var(--surface-2)}

  /* ---------- Auth hero ---------- */
  #auth{min-height:100vh; display:grid; place-items:center; padding:32px 20px}
  .hero{width:100%; max-width:440px; text-align:center}
  .logo{
    width:76px; height:76px; margin:0 auto 22px; border-radius:24px;
    display:grid; place-items:center; color:#fff; font:800 36px var(--serif);
    background:linear-gradient(145deg,var(--accent),var(--brand));
    box-shadow:0 18px 40px rgba(59,39,24,.35), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .hero h1{font:700 38px/1.1 var(--serif); letter-spacing:-.02em; margin:0}
  .hero h1 em{color:var(--accent); font-style:italic}
  .hero p{color:var(--muted); margin:12px auto 26px; max-width:38ch}
  .login{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); display:grid; gap:12px; text-align:left;
  }
  .login label{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
  .login .row{display:flex; gap:10px}
  .login .row button{flex:0 0 auto}
  .login input{flex:1}
  .login-err{color:var(--bad); background:var(--bad-bg); padding:10px 12px; border-radius:10px; font-weight:550; font-size:14px}
  .secure{margin-top:18px; font-size:13px; color:var(--muted)}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; backdrop-filter:blur(14px);
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    border-bottom:1px solid var(--line);
  }
  .topbar .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:12px; padding-bottom:12px}
  .tb-brand{display:flex; align-items:center; gap:12px}
  .tb-logo{
    width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
    color:#fff; font:800 18px var(--serif); background:linear-gradient(145deg,var(--accent),var(--brand));
  }
  .tb-title{font:700 18px var(--serif); line-height:1.1}
  .tb-title small{display:block; font:500 12px var(--sans); color:var(--muted); margin-top:2px}
  .tb-actions{display:flex; gap:8px}
  .tb-actions button{padding:9px 14px}

  /* ---------- Stats ---------- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:28px 0 8px}
  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat::after{
    content:""; position:absolute; right:-24px; top:-24px; width:90px; height:90px; border-radius:50%;
    background:var(--accent-soft); opacity:.9;
  }
  .stat .label{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); position:relative; z-index:1}
  .stat .value{font:700 32px/1.15 var(--serif); margin-top:6px; position:relative; z-index:1; font-variant-numeric:tabular-nums}
  .stat .sub{font-size:13px; color:var(--muted); position:relative; z-index:1}
  .stat.alert .value{color:var(--bad)}

  /* ---------- Sections ---------- */
  .section{margin-top:38px}
  .section-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
  .section-head h2{font:700 24px var(--serif); letter-spacing:-.01em; margin:0}
  .section-head h2 span{font:500 14px var(--sans); color:var(--muted); margin-left:8px}
  .tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .search{width:240px}
  .chips{display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); padding:4px; border-radius:14px}
  .chips button{
    padding:7px 13px; background:transparent; color:var(--muted); box-shadow:none; font-weight:600; border-radius:10px; font-size:14px;
  }
  .chips button:hover{transform:none; filter:none; color:var(--ink)}
  .chips button.on{background:var(--accent-soft); color:var(--brand-2)}
  @media (prefers-color-scheme:dark){ .chips button.on{color:var(--accent)} }

  /* ---------- Product cards ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px}
  .pcard{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
    transition:transform .15s, border-color .15s;
  }
  .pcard:hover{transform:translateY(-2px); border-color:var(--line-strong)}
  .ptop{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
  .pname{font:700 18px/1.25 var(--serif)}
  .pid{font-size:12px; color:var(--muted)}
  .badge{
    flex:0 0 auto; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:700;
    background:var(--ok-bg); color:var(--ok);
  }
  .badge.low{background:var(--warn-bg); color:var(--warn)}
  .badge.out{background:var(--bad-bg); color:var(--bad)}
  .stockline{display:flex; align-items:baseline; gap:8px}
  .stockline b{font:700 40px/1 var(--serif); font-variant-numeric:tabular-nums}
  .stockline span{color:var(--muted); font-size:13px}
  .bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--ok),#6fcf8a); transition:width .4s ease}
  .bar.low i{background:linear-gradient(90deg,var(--warn),#f2b84b)}
  .bar.out i{background:var(--bad)}
  .editor{display:flex; gap:8px; align-items:center}
  .stepper{display:flex; align-items:center; border:1px solid var(--line-strong); border-radius:12px; background:var(--surface-2); overflow:hidden}
  .stepper button{
    padding:0; width:38px; height:40px; border-radius:0; background:transparent; color:var(--ink);
    box-shadow:none; font-size:18px; font-weight:600;
  }
  .stepper button:hover{background:var(--accent-soft); transform:none; filter:none}
  .stepper input{
    width:78px; border:0; border-radius:0; text-align:center; background:transparent;
    font-weight:700; font-variant-numeric:tabular-nums; padding:10px 0; box-shadow:none !important;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .editor .save{flex:1}
  .editor .save.idle{background:var(--surface-2); color:var(--muted); box-shadow:none; border-color:var(--line)}
  .editor .save.idle:hover{transform:none; filter:none}

  /* ---------- Orders ---------- */
  .orders{display:grid; gap:12px}
  .order{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start;
  }
  .avatar{
    width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
    font:700 18px var(--serif); color:var(--brand-2); background:var(--accent-soft);
  }
  @media (prefers-color-scheme:dark){ .avatar{color:var(--accent)} }
  .o-main .row1{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
  .o-name{font-weight:700}
  .ref{font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); padding:2px 8px; border-radius:8px}
  .status{padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; text-transform:capitalize; background:var(--info-bg); color:var(--info)}
  .status.paid,.status.completed,.status.delivered,.status.done{background:var(--ok-bg); color:var(--ok)}
  .status.pending,.status.processing,.status.new{background:var(--warn-bg); color:var(--warn)}
  .status.cancelled,.status.canceled,.status.failed,.status.refunded{background:var(--bad-bg); color:var(--bad)}
  .meta{color:var(--muted); font-size:13.5px; margin-top:3px}
  .items{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .chip{background:var(--surface-2); border:1px solid var(--line); padding:3px 10px; border-radius:9px; font-size:13px}
  .chip b{color:var(--accent)}
  .o-total{font:700 22px var(--serif); font-variant-numeric:tabular-nums; text-align:right}
  .empty{
    padding:44px 20px; text-align:center; color:var(--muted); background:var(--surface);
    border:1px dashed var(--line-strong); border-radius:var(--radius);
  }
  .empty big{display:block; font-size:34px; margin-bottom:6px}

  /* ---------- Tabs ---------- */
  .tabs{
    display:inline-flex; gap:6px; margin-top:30px; padding:5px;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  }
  .tab{
    display:flex; align-items:center; gap:9px; padding:11px 22px; border-radius:12px;
    background:transparent; color:var(--muted); box-shadow:none; font-size:15px; font-weight:700;
  }
  .tab:hover{transform:none; filter:none; color:var(--ink); background:var(--surface-2)}
  .tab.on{
    background:linear-gradient(135deg,var(--brand-2),var(--brand)); color:#fff;
    box-shadow:0 4px 14px rgba(59,39,24,.25);
  }
  @media (prefers-color-scheme:dark){ .tab.on{color:#1b1209} }
  .tab .count{
    min-width:24px; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:800; text-align:center;
    background:var(--accent-soft); color:var(--brand-2);
  }
  .tab.on .count{background:rgba(255,255,255,.22); color:inherit}
  .tab .count.alert{background:var(--bad-bg); color:var(--bad)}
  .tabpanel.section{margin-top:22px; animation:in .25s ease}
  @media (max-width:560px){
    .tabs{display:flex} .tab{flex:1; justify-content:center; padding:11px 10px}
  }

  /* ---------- Order actions ---------- */
  .o-actions{
    grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;
    padding-top:14px; border-top:1px dashed var(--line);
  }
  .o-actions button{padding:9px 14px; font-size:14px}
  .status-edit{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  select{
    font:inherit; font-weight:600; padding:9px 12px; border-radius:12px; text-transform:capitalize;
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); cursor:pointer;
  }
  select:focus-visible{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(201,130,64,.25)}
  .status-edit .save.idle{background:var(--surface-2); color:var(--muted); box-shadow:none; border-color:var(--line)}
  .status-edit .save.idle:hover{transform:none; filter:none}

  /* ---------- Order detail dialog ---------- */
  dialog{
    width:calc(100% - 28px); max-width:580px; max-height:calc(100vh - 40px); padding:0; border:1px solid var(--line);
    border-radius:22px; background:var(--surface); color:var(--ink); box-shadow:0 30px 80px rgba(0,0,0,.4);
    overflow:auto; margin:auto;
  }
  dialog[open]{animation:in .22s ease}
  dialog::backdrop{background:rgba(20,12,6,.55); backdrop-filter:blur(4px)}
  .dlg-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 22px 14px;
    position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line); z-index:1;
  }
  .dlg-head h3{margin:0; font:700 22px var(--serif)}
  .dlg-head .close{padding:7px 12px}
  .dlg-body{padding:20px 22px 24px; display:grid; gap:20px}
  .dl{display:grid; grid-template-columns:110px 1fr; gap:8px 14px; margin:0}
  .dl dt{color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding-top:2px}
  .dl dd{margin:0; word-break:break-word}
  .dlg-sub{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
  .lines{border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .line{display:flex; justify-content:space-between; gap:12px; padding:11px 14px; border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line .q{color:var(--accent); font-weight:800; margin-right:8px}
  .line.total{background:var(--surface-2); font-weight:800; font-size:17px}
  .line.total span:last-child{font-family:var(--serif); font-size:20px}

  /* ---------- Toast ---------- */
  #toasts{position:fixed; right:18px; bottom:18px; z-index:50; display:grid; gap:10px; max-width:min(380px,calc(100vw - 36px))}
  .toast{
    padding:13px 16px; border-radius:14px; font-weight:600; box-shadow:0 12px 30px rgba(0,0,0,.25);
    background:var(--brand); color:#fff; animation:in .25s ease; display:flex; gap:10px; align-items:center;
  }
  @media (prefers-color-scheme:dark){ .toast{color:#1b1209} }
  .toast.ok{background:var(--ok); color:#fff}
  .toast.err{background:var(--bad); color:#fff}
  @keyframes in{from{opacity:0; transform:translateY(10px) scale(.98)}to{opacity:1; transform:none}}

  footer{margin:60px 0 40px; text-align:center; color:var(--muted); font-size:13px}

  @media (max-width:860px){ .stats{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){
    .hero h1{font-size:32px}
    .login .row{flex-direction:column}
    .search{width:100%} .tools{width:100%}
    .stat .value{font-size:26px}
    .order{grid-template-columns:auto 1fr}
    .o-total{grid-column:2; text-align:left}
    .tb-title small{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="auth">
  <div class="hero">
    <div class="logo" aria-hidden="true">B</div>
    <h1>BROWN <em>Shop</em></h1>
    <p>Manage your stock and keep an eye on the latest orders, all in one place.</p>
    <div class="login">
      <label for="token">Admin token</label>
      <div class="row">
        <input id="token" type="password" placeholder="Paste your ADMIN_TOKEN" autocomplete="off">
        <button id="load">Sign in</button>
      </div>
      <div id="message" class="login-err" role="status" aria-live="polite" hidden></div>
    </div>
    <div class="secure">🔒 Server-side ADMIN_TOKEN — never share it with customers.</div>
  </div>
</section>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard" hidden>
  <header class="topbar">
    <div class="wrap">
      <div class="tb-brand">
        <div class="tb-logo" aria-hidden="true">B</div>
        <div class="tb-title">BROWN Shop<small>Inventory &amp; Orders</small></div>
      </div>
      <div class="tb-actions">
        <button id="refresh" class="ghost">↻ Refresh</button>
        <button id="logout" class="ghost">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab on" id="tabbtn-stock" data-tab="stock" role="tab" aria-selected="true" aria-controls="tab-stock">
        📦 Stock <span class="count" id="tc-stock">0</span>
      </button>
      <button class="tab" id="tabbtn-orders" data-tab="orders" role="tab" aria-selected="false" aria-controls="tab-orders">
        🧾 Orders <span class="count" id="tc-orders">0</span>
      </button>
    </nav>

    <section class="section tabpanel" id="tab-stock" role="tabpanel" aria-labelledby="tabbtn-stock">
      <div class="section-head">
        <h2>Product stock<span id="pcount"></span></h2>
        <div class="tools">
          <input id="psearch" class="search" type="search" placeholder="Search products…" aria-label="Search products">
          <div class="chips" id="pfilter">
            <button data-f="all" class="on">All</button>
            <button data-f="low">Low</button>
            <button data-f="out">Out</button>
          </div>
        </div>
      </div>
      <div id="products" class="grid"></div>
    </section>

    <section class="section tabpanel" id="tab-orders" role="tabpanel" aria-labelledby="tabbtn-orders" hidden>
      <div class="section-head">
        <h2>Latest 100 orders<span id="ocount"></span></h2>
        <div class="tools">
          <input id="osearch" class="search" type="search" placeholder="Search name, phone, ref…" aria-label="Search orders">
        </div>
      </div>
      <div id="orders" class="orders"></div>
    </section>

    <footer>BROWN Shop admin · data refreshes whenever you press Refresh</footer>
  </main>
</div>

<dialog id="odlg" aria-labelledby="odlg-title">
  <div class="dlg-head">
    <h3 id="odlg-title">Order</h3>
    <button id="odlg-close" class="ghost close" aria-label="Close">✕</button>
  </div>
  <div id="odlg-body" class="dlg-body"></div>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);
let token='';
let state={products:[],orders:[]};
let pFilter='all';
const LOW=5;

/* ---------- helpers ---------- */
function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=String(text);
  return e;
}
function toast(text,type){
  const t=el('div','toast '+(type||''),text);
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300);},3200);
}
function msg(text,type){
  // inline message on the login card, toast when signed in
  const m=$('message');
  if(!$('dashboard').hidden){ if(text)toast(text,type); return; }
  m.hidden=!text; m.textContent=text||'';
}
const money=c=>'$'+(Number(c)/100).toFixed(2);
const level=n=>n<=0?'out':(n<=LOW?'low':'ok');

/* ---------- order status + detail ---------- */
const STATUSES=['pending','paid','processing','shipped','completed','cancelled'];
const statusClass=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

// Dropdown + button that PATCHes the order status. `after(updatedRef)` runs once saved.
function statusControl(o,after){
  const wrap=el('div','status-edit');
  const sel=document.createElement('select');
  sel.setAttribute('aria-label','Order status for '+o.ref);
  const cur=String(o.status||'').toLowerCase();
  const opts=(!cur||STATUSES.includes(cur))?STATUSES:[cur,...STATUSES];
  for(const s of opts){const op=el('option',null,s);op.value=s;sel.appendChild(op);}
  sel.value=cur||STATUSES[0];
  const initial=sel.value;

  const btn=el('button','save idle','Update status');
  btn.type='button';
  sel.addEventListener('change',()=>btn.classList.toggle('idle',sel.value===initial));
  btn.onclick=async()=>{
    if(sel.value===initial)return;
    btn.disabled=true; sel.disabled=true;
    try{
      await request('PATCH',{id_order:o.id,ref:o.ref,status:sel.value});
      await refresh(true);
      toast('Order '+o.ref+' → '+sel.value,'ok');
      if(after)after(o.ref);
    }catch(e){msg(e.message,'err');btn.disabled=false;sel.disabled=false;}
  };
  wrap.append(sel,btn);
  return wrap;
}

function openOrder(o){
  const dlg=$('odlg'), body=$('odlg-body');
  $('odlg-title').textContent='Order '+o.ref;
  body.replaceChildren();

  // customer / info
  const dl=el('dl','dl');
  const row=(k,v)=>{ if(v===undefined||v===null||v==='')return; dl.appendChild(el('dt',null,k)); dl.appendChild(el('dd',null,v)); };
  row('Customer',o.name);
  row('Phone',o.phone);
  row('Placed',new Date(o.created_at).toLocaleString());
  row('Address',o.address);
  row('Note',o.note||o.notes);
  const stDd=el('dd'); stDd.appendChild(el('span','status '+statusClass(o.status),o.status||'—'));
  dl.appendChild(el('dt',null,'Status')); dl.appendChild(stDd);
  body.appendChild(dl);

  // items
  const itemsWrap=el('div');
  itemsWrap.appendChild(el('p','dlg-sub','Items'));
  const lines=el('div','lines');
  for(const x of (o.items||[])){
    const l=el('div','line');
    const left=el('span');
    left.appendChild(el('span','q',x.qty+'×'));
    left.appendChild(document.createTextNode(x.name));
    l.appendChild(left);
    lines.appendChild(l);
  }
  const t=el('div','line total');
  t.appendChild(el('span',null,'Total'));
  t.appendChild(el('span',null,money(o.total_cents)));
  lines.appendChild(t);
  itemsWrap.appendChild(lines);
  body.appendChild(itemsWrap);

  // change status
  const sw=el('div');
  sw.appendChild(el('p','dlg-sub','Change status'));
  sw.appendChild(statusControl(o,ref=>{
    const fresh=state.orders.find(x=>x.ref===ref);
    if(fresh)openOrder(fresh);
  }));
  body.appendChild(sw);

  if(!dlg.open)dlg.showModal();
}

async function request(method,body){
  const r=await fetch('/api/admin',{
    method,
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:body?JSON.stringify(body):undefined,
    cache:'no-store'
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.error||'Request failed');
  return data;
}

/* ---------- renderers ---------- */
function renderStats(){
  const {products,orders}=state;
  const units=products.reduce((s,p)=>s+Number(p.stock||0),0);
  const low=products.filter(p=>level(Number(p.stock))!=='ok').length;
  const revenue=orders.reduce((s,o)=>s+Number(o.total_cents||0),0);
  const cards=[
    ['Products',products.length,'in your catalog',''],
    ['Units in stock',units.toLocaleString(),'across all products',''],
    ['Need attention',low,low?'low or out of stock':'everything looks good',low?'alert':''],
    ['Recent revenue',money(revenue),orders.length+' latest orders','']
  ];
  const box=$('stats'); box.replaceChildren();
  for(const [l,v,s,c] of cards){
    const d=el('div','stat '+c);
    d.appendChild(el('div','label',l));
    d.appendChild(el('div','value',v));
    d.appendChild(el('div','sub',s));
    box.appendChild(d);
  }
}

function productCard(p,max){
  const stock=Number(p.stock);
  const lv=level(stock);
  const card=el('div','pcard');

  const top=el('div','ptop');
  const nm=el('div');
  nm.appendChild(el('div','pname',p.name));
  top.appendChild(nm);
  top.appendChild(el('span','badge '+(lv==='ok'?'':lv),lv==='out'?'Out of stock':lv==='low'?'Low stock':'In stock'));
  card.appendChild(top);

  const line=el('div','stockline');
  line.appendChild(el('b',null,stock.toLocaleString()));
  line.appendChild(el('span',null,'units available'));
  card.appendChild(line);

  const bar=el('div','bar '+(lv==='ok'?'':lv));
  const fill=document.createElement('i');
  fill.style.width=Math.max(stock>0?4:0,Math.min(100,stock/max*100))+'%';
  bar.appendChild(fill);
  card.appendChild(bar);

  const editor=el('div','editor');
  const stepper=el('div','stepper');
  const minus=el('button',null,'−'); minus.type='button'; minus.setAttribute('aria-label','Decrease');
  const plus=el('button',null,'+'); plus.type='button'; plus.setAttribute('aria-label','Increase');
  const input=document.createElement('input');
  input.type='number'; input.min=0; input.max=1000000; input.value=stock;
  input.setAttribute('aria-label','New stock for '+p.name);
  stepper.append(minus,input,plus);

  const save=el('button','save idle','Save');
  save.type='button';

  const sync=()=>{
    const changed=input.value!==''&&Number(input.value)!==stock;
    save.classList.toggle('idle',!changed);
  };
  const bump=d=>{input.value=Math.max(0,(Number(input.value)||0)+d);sync();};
  minus.onclick=()=>bump(-1);
  plus.onclick=()=>bump(1);
  input.addEventListener('input',sync);

  save.onclick=async()=>{
    const val=Number(input.value);
    if(input.value===''||!Number.isSafeInteger(val)||val<0)return msg('Enter a valid nonnegative stock','err');
    save.disabled=true;
    try{
      await request('PATCH',{id_menu:p.id_menu,stock:val});
      await refresh(true);
      toast('Saved stock for '+p.name,'ok');
    }catch(e){msg(e.message,'err');}
    finally{save.disabled=false;}
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter')save.click();});

  editor.append(stepper,save);
  card.appendChild(editor);
  return card;
}

function renderProducts(){
  const q=$('psearch').value.trim().toLowerCase();
  const max=Math.max(20,...state.products.map(p=>Number(p.stock)||0));
  const list=state.products.filter(p=>{
    const lv=level(Number(p.stock));
    if(pFilter==='low'&&lv!=='low')return false;
    if(pFilter==='out'&&lv!=='out')return false;
    return !q||String(p.name).toLowerCase().includes(q);
  });
  const box=$('products'); box.replaceChildren();
  for(const p of list)box.appendChild(productCard(p,max));
  if(!list.length){
    const e=el('div','empty'); e.style.gridColumn='1/-1';
    e.appendChild(el('big',null,'📦'));
    e.appendChild(document.createTextNode(state.products.length?'No products match your filter.':'No products yet.'));
    box.appendChild(e);
  }
  $('pcount').textContent=list.length===state.products.length?state.products.length+' items':list.length+' of '+state.products.length;
}

function renderOrders(){
  const q=$('osearch').value.trim().toLowerCase();
  const list=state.orders.filter(o=>!q||[o.ref,o.name,o.phone].some(v=>String(v||'').toLowerCase().includes(q)));
  const box=$('orders'); box.replaceChildren();
  for(const o of list){
    const card=el('div','order');
    card.appendChild(el('div','avatar',(String(o.name||'?').trim()[0]||'?').toUpperCase()));

    const main=el('div','o-main');
    const r1=el('div','row1');
    r1.appendChild(el('span','o-name',o.name));
    const st=String(o.status||'');
    r1.appendChild(el('span','status '+statusClass(st),st));
    r1.appendChild(el('span','ref',o.ref));
    main.appendChild(r1);
    main.appendChild(el('div','meta',o.phone+' · '+new Date(o.created_at).toLocaleString()));
    const items=el('div','items');
    for(const x of o.items){
      const c=el('span','chip');
      c.appendChild(el('b',null,x.qty+'× '));
      c.appendChild(document.createTextNode(x.name));
      items.appendChild(c);
    }
    main.appendChild(items);
    card.appendChild(main);

    card.appendChild(el('div','o-total',money(o.total_cents)));

    const actions=el('div','o-actions');
    const detailBtn=el('button','ghost','View details');
    detailBtn.type='button';
    detailBtn.onclick=()=>openOrder(o);
    actions.append(detailBtn,statusControl(o));
    card.appendChild(actions);

    box.appendChild(card);
  }
  if(!list.length){
    const e=el('div','empty');
    e.appendChild(el('big',null,'🧾'));
    e.appendChild(document.createTextNode(state.orders.length?'No orders match your search.':'No orders yet.'));
    box.appendChild(e);
  }
  $('ocount').textContent=state.orders.length+' orders';
}

function renderAll(){
  renderStats();renderProducts();renderOrders();
  $('tc-stock').textContent=state.products.length;
  $('tc-orders').textContent=state.orders.length;
  const needs=state.products.filter(p=>level(Number(p.stock))!=='ok').length;
  $('tc-stock').classList.toggle('alert',needs>0);
}

function setTab(name){
  if(name!=='stock'&&name!=='orders')name='stock';
  for(const b of document.querySelectorAll('.tab')){
    const on=b.dataset.tab===name;
    b.classList.toggle('on',on);
    b.setAttribute('aria-selected',on);
  }
  $('tab-stock').hidden=name!=='stock';
  $('tab-orders').hidden=name!=='orders';
  try{history.replaceState(null,'','#'+name);}catch(e){}
}

/* ---------- data flow ---------- */
async function refresh(silent){
  const data=await request('GET');
  state=data;
  renderAll();
  $('auth').hidden=true;
  $('dashboard').hidden=false;
  if(!silent)toast('Loaded '+data.products.length+' products and '+data.orders.length+' orders.','ok');
}

async function login(){
  token=$('token').value.trim()||token;
  if(!token)return msg('Admin token required','err');
  const btn=$('load'); btn.disabled=true;
  try{ msg(''); await refresh(false); }
  catch(e){
    $('dashboard').hidden=true; $('auth').hidden=false;
    msg(e.message,'err');
  }finally{btn.disabled=false;}
}

function logout(){
  token=''; state={products:[],orders:[]};
  $('token').value='';
  $('dashboard').hidden=true; $('auth').hidden=false;
  msg('');
  $('token').focus();
}

/* ---------- events ---------- */
$('load').onclick=login;
$('token').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
$('refresh').onclick=async()=>{
  try{await refresh(false);}catch(e){msg(e.message,'err');}
};
$('logout').onclick=logout;
$('odlg-close').onclick=()=>$('odlg').close();
$('odlg').addEventListener('click',e=>{ if(e.target===$('odlg'))$('odlg').close(); }); // click backdrop to close
document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(b)setTab(b.dataset.tab);
});
setTab(location.hash.replace('#',''));
$('psearch').addEventListener('input',renderProducts);
$('osearch').addEventListener('input',renderOrders);
$('pfilter').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  pFilter=b.dataset.f;
  for(const x of $('pfilter').children)x.classList.toggle('on',x===b);
  renderProducts();
});
</script>
</body>
